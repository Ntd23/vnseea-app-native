<header class="bg-[#0000ff] flex items-center w-full px-space-4 sticky top-0 z-50 py-2 min-h-[56px]">
<div class="flex items-center z-10">
<button class="text-on-primary p-2 hover:opacity-90 transition-opacity">

</div>
<h1 class="absolute inset-0 flex items-center justify-center text-heading font-display text-on-primary font-bold pointer-events-none">Thu nhập</h1>
<div class="w-10"></div></header>
<main class="flex-1 flex flex-col p-space-4 gap-space-6 pb-space-12 relative z-10 bg-background">

<button class="w-full bg-surface-container-highest rounded-xl border border-border-light shadow-md p-space-4 flex items-center justify-between hover:bg-surface-container-high transition-all group text-left">
<div class="flex flex-col gap-space-1 pr-space-4">
<h2 class="text-heading font-heading text-on-surface font-bold">Tăng thu nhập của bạn</h2>
<p class="text-body-primary font-body-primary text-on-surface-variant leading-tight">Khám phá các chương trình tiếp thị liên kết mới nhất.</p>
</div>
<div class="flex-shrink-0">
<span class="material-symbols-outlined text-primary text-2xl group-hover:translate-x-1 transition-transform" data-icon="chevron_right" data-weight="regular">chevron_right</span>
</div>
</button>

<h3 class="text-title-primary font-title-primary text-on-surface px-space-2">Thu nhập</h3>
<div class="bg-surface rounded-xl border border-border-light shadow-md flex flex-col divide-y divide-border-light overflow-hidden">

</div>

</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right" data-weight="regular">chevron_right</span>
</button>
<button class="flex items-center justify-between p-space-4 hover:bg-surface-container-low transition-colors group">

</div>

</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right" data-weight="regular">chevron_right</span>
