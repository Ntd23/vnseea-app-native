    body {

<body class="bg-background text-on-background font-body-primary text-body-primary min-h-screen pb-space-12 md:pb-0">
<!-- TopAppBar -->
<header class="bg-primary-container text-on-primary fixed top-0 w-full z-50 border-b border-light shadow-md">
<div class="flex items-center px-space-4 h-16 w-full">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-heading text-heading ml-space-2">Rút tiền</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 px-space-4 md:px-space-8 max-w-3xl mx-auto space-y-space-6 pb-space-12">
<!-- Current Balance Card -->
<section class="bg-surface-container-lowest rounded-xl p-space-6 shadow-sm border border-surface-variant flex flex-col items-center justify-center">
<p class="font-body-primary text-body-primary text-on-surface-variant mb-space-2">Số dư hiện tại</p>
<h2 class="font-display text-display text-primary">$1,250.00</h2>
</section>
<!-- Withdrawal Form -->
<form class="bg-surface-container-lowest rounded-xl p-space-6 shadow-sm border border-surface-variant space-y-space-6">
<!-- Withdraw Method -->
<div class="space-y-space-2">
<label class="block font-title-primary text-title-primary text-on-surface" for="withdraw-method">Phương thức rút tiền</label>
<div class="relative">
<select class="block w-full rounded-lg border-outline-variant bg-surface px-space-4 py-space-3 text-on-surface focus:border-primary focus:ring-primary appearance-none" id="withdraw-method" name="withdraw-method">
<option value="paypal">PayPal</option>
<option value="bank_transfer">Chuyển khoản ngân hàng</option>
<option value="momo">Ví MoMo</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-space-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Amount Input -->
<div class="space-y-space-2">
<label class="block font-title-primary text-title-primary text-on-surface" for="amount">Số tiền (USD)</label>
<div class="relative mt-1 rounded-md shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-space-4">
<span class="text-on-surface-variant sm:text-sm">$</span>
</div>
<input aria-describedby="amount-currency" class="block w-full rounded-lg border-outline-variant bg-surface pl-10 pr-space-4 py-space-3 text-on-surface focus:border-primary focus:ring-primary sm:text-sm" id="amount" name="amount" placeholder="0.00" type="number"/>
</div>
<p class="font-caption text-caption text-on-surface-variant">Số tiền tối thiểu: $50.00</p>
</div>
<!-- Email PayPal Input -->
<div class="space-y-space-2">
<label class="block font-title-primary text-title-primary text-on-surface" for="paypal-email">Email PayPal</label>
<input class="block w-full rounded-lg border-outline-variant bg-surface px-space-4 py-space-3 text-on-surface focus:border-primary focus:ring-primary sm:text-sm" id="paypal-email" name="paypal-email" placeholder="email@example.com" type="email"/>
</div>
<!-- Submit Button -->
<div class="pt-space-4">
<button class="w-full flex justify-center py-space-3 px-space-4 border border-transparent rounded-full shadow-[0_4px_14px_0_rgba(0,0,255,0.39)] font-title-primary text-title-primary text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-95 transition-all duration-200" type="submit">
                    Yêu cầu rút tiền
                </button>
</div>
</form>
</main>
</body></html>
