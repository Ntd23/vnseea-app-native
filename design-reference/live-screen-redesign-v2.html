<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <title>Live screen redesign</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 2400px; overflow: hidden; }
    body { font-family: "Segoe UI", Arial, sans-serif; color: #fff; background: #191919; }
    .screen { position: relative; width: 1080px; height: 2400px; overflow: hidden; background: #373b3d; }
    .video {
      position: absolute; inset: -80px;
      background:
        radial-gradient(circle at 55% 14%, rgba(255,255,255,.98) 0 2.5%, rgba(245,243,225,.82) 3.2%, rgba(221,225,222,.16) 12%, transparent 25%),
        radial-gradient(circle at 49% 82%, rgba(255,255,255,.9) 0 4%, rgba(244,247,241,.28) 12%, transparent 27%),
        linear-gradient(168deg, rgba(93,98,98,.25), rgba(172,176,171,.3) 45%, rgba(66,70,72,.35)),
        url("live-screen-current.png") center 38% / 175% auto no-repeat;
      filter: blur(5px) brightness(.78) saturate(.72);
      transform: scale(1.06);
    }
    .screen::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,.56) 0, rgba(0,0,0,.12) 18%, transparent 48%, rgba(0,0,0,.12) 63%, rgba(0,0,0,.84) 100%);
    }
    .status { position: absolute; z-index: 3; top: 0; left: 0; right: 0; height: 92px; display: flex; align-items: center; justify-content: space-between; padding: 16px 48px 0; font-size: 30px; font-weight: 700; letter-spacing: .2px; }
    .status-icons { display: flex; align-items: center; gap: 15px; font-size: 24px; }
    .signal { display: flex; align-items: end; gap: 4px; height: 28px; }
    .signal i { display:block; width:5px; border-radius:4px; background:#fff; }
    .signal i:nth-child(1){height:8px}.signal i:nth-child(2){height:14px}.signal i:nth-child(3){height:21px}.signal i:nth-child(4){height:28px}
    .battery { display:flex; align-items:center; height:28px; border:2px solid #fff; border-radius:7px; padding:2px 5px; font-size:16px; }
    .topbar { position:absolute; z-index:3; top:44px; left:36px; right:36px; display:flex; align-items:center; justify-content:space-between; }
    .host { display:flex; align-items:center; gap:16px; padding:10px 18px 10px 10px; border:1px solid rgba(255,255,255,.16); background:rgba(18,20,21,.52); backdrop-filter:blur(20px); border-radius:52px; box-shadow:0 10px 35px rgba(0,0,0,.18); }
    .avatar { width:74px; height:74px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:29px; background:linear-gradient(145deg,#46d292,#3185ff); border:3px solid rgba(255,255,255,.9); box-shadow:0 0 0 3px rgba(255,255,255,.12); }
    .host-text { min-width:220px; }
    .host-name { font-size:32px; line-height:1.05; font-weight:750; }
    .live-line { display:flex; align-items:center; gap:9px; margin-top:7px; }
    .live-badge { padding:5px 12px; border-radius:10px; background:#f04455; font-size:20px; font-weight:800; letter-spacing:.8px; }
    .live-dot { width:8px; height:8px; border-radius:50%; background:#ff6070; box-shadow:0 0 0 6px rgba(255,65,85,.16); }
    .live-time { font-size:20px; color:rgba(255,255,255,.7); }
    .top-actions { display:flex; align-items:center; gap:12px; }
    .glass { background:rgba(18,20,21,.56); border:1px solid rgba(255,255,255,.13); backdrop-filter:blur(18px); box-shadow:0 8px 28px rgba(0,0,0,.17); }
    .viewer { height:62px; padding:0 20px; border-radius:31px; display:flex; align-items:center; gap:10px; font-size:25px; font-weight:650; }
    .circle { width:62px; height:62px; border-radius:50%; display:grid; place-items:center; }
    .circle svg, .viewer svg { width:30px; height:30px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .mini-tools { position:absolute; z-index:3; top:144px; right:38px; display:flex; gap:10px; }
    .mini { width:58px; height:58px; border-radius:50%; display:grid; place-items:center; }
    .mini svg { width:27px; height:27px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .live-chip { position:absolute; z-index:3; left:34px; right:158px; bottom:350px; min-height:88px; padding:17px 22px; border-radius:25px; display:flex; align-items:center; gap:16px; }
    .spark { width:46px; height:46px; border-radius:15px; display:grid; place-items:center; background:linear-gradient(145deg,#ff5368,#ff9345); font-size:25px; }
    .live-chip-text { flex:1; min-width:0; }
    .live-chip-title { font-size:22px; font-weight:760; margin-bottom:3px; }
    .live-chip-sub { font-size:23px; color:rgba(255,255,255,.76); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chev { width:25px; height:25px; border-right:3px solid #fff; border-bottom:3px solid #fff; transform:rotate(45deg) translateY(-5px); opacity:.85; }
    .comments { position:absolute; z-index:3; left:34px; bottom:470px; width:720px; display:flex; flex-direction:column; gap:13px; }
    .comment { align-self:flex-start; max-width:680px; display:flex; align-items:flex-start; gap:13px; padding:12px 18px 13px 12px; border-radius:25px; background:linear-gradient(90deg,rgba(12,14,15,.72),rgba(12,14,15,.42)); border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(14px); }
    .comment-avatar { flex:0 0 auto; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:17px; font-weight:900; background:#ee394d; }
    .comment-copy { padding-top:1px; font-size:25px; line-height:1.28; }
    .comment-name { color:#ffd0d5; font-size:20px; font-weight:750; margin-bottom:2px; }
    .reaction-float { position:absolute; z-index:3; right:46px; bottom:595px; display:flex; flex-direction:column; gap:18px; align-items:center; }
    .action { width:74px; height:74px; border-radius:50%; display:grid; place-items:center; }
    .action.primary { width:86px; height:86px; background:linear-gradient(145deg,#ff5368,#ff2e58); box-shadow:0 15px 34px rgba(255,42,83,.35); border:1px solid rgba(255,255,255,.24); }
    .action svg { width:34px; height:34px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .action.primary svg { width:43px; height:43px; fill:#fff; stroke:#fff; }
    .flying { position:absolute; z-index:2; right:72px; bottom:1070px; font-size:44px; opacity:.72; transform:rotate(-8deg); text-shadow:0 5px 15px rgba(0,0,0,.18); }
    .flying.two { right:126px; bottom:1170px; font-size:38px; opacity:.55; transform:rotate(10deg); }
    .flying.three { right:56px; bottom:1270px; font-size:36px; opacity:.48; transform:rotate(-12deg); }
    .flying.four { right:145px; bottom:1365px; font-size:32px; opacity:.38; transform:rotate(8deg); }
    .reaction-menu { position:absolute; z-index:4; right:34px; bottom:800px; width:224px; padding:14px; border-radius:34px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .reaction-menu::after { content:""; position:absolute; right:29px; bottom:-12px; width:24px; height:24px; background:rgba(18,20,21,.72); transform:rotate(45deg); border-right:1px solid rgba(255,255,255,.12); border-bottom:1px solid rgba(255,255,255,.12); }
    .reaction-option { position:relative; z-index:1; width:58px; height:58px; border-radius:50%; display:grid; place-items:center; font-size:37px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.08); }
    .reaction-option.selected { background:rgba(255,70,99,.23); box-shadow:inset 0 0 0 2px rgba(255,91,115,.55); }
    .reaction-activity { position:absolute; z-index:3; left:34px; bottom:810px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
    .activity-item { min-height:52px; padding:7px 15px 7px 8px; border-radius:26px; display:flex; align-items:center; gap:10px; color:rgba(255,255,255,.92); font-size:20px; }
    .activity-avatar { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:15px; font-weight:850; color:#fff; background:linear-gradient(145deg,#7558ff,#3e90ff); }
    .activity-item strong { font-weight:760; }
    .activity-emoji { font-size:28px; margin-left:2px; }
    .composer { position:absolute; z-index:4; left:34px; right:34px; bottom:46px; height:112px; display:flex; align-items:center; gap:14px; }
    .input { flex:1; height:94px; border-radius:47px; display:flex; align-items:center; padding:0 20px 0 30px; color:rgba(255,255,255,.7); font-size:27px; }
    .input span { flex:1; }
    .input svg { width:36px; height:36px; fill:none; stroke:#fff; stroke-width:2; opacity:.9; }
    .composer-btn { flex:0 0 auto; width:84px; height:84px; border-radius:50%; display:grid; place-items:center; }
    .composer-btn svg { width:36px; height:36px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .home { position:absolute; z-index:4; left:410px; bottom:38px; width:260px; height:9px; border-radius:5px; background:rgba(255,255,255,.92); }
    .hint { position:absolute; z-index:3; top:320px; left:50%; transform:translateX(-50%); padding:10px 18px; border-radius:20px; color:rgba(255,255,255,.74); font-size:20px; background:rgba(8,10,10,.24); opacity:.9; }
  </style>
</head>
<body>
  <main class="screen">
    <div class="video"></div>
    <section class="topbar">
      <div class="host"><div class="avatar">D</div><div class="host-text"><div class="host-name">Doraemon</div><div class="live-line"><span class="live-badge">LIVE</span><span class="live-dot"></span><span class="live-time">12:48</span></div></div></div>
      <div class="top-actions">
        <div class="viewer glass"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg><span>2</span></div>
        <div class="circle glass"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      </div>
    </section>
    <div class="mini-tools">
      <div class="mini glass"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v11H4Z"/><path d="M15.5 10.5a4 4 0 1 1-7 2.7"/><path d="M8 9H5V6"/></svg></div>
      <div class="mini glass"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></div>
    </div>
    <div class="comments">
      <div class="comment"><div class="comment-avatar">VN</div><div class="comment-copy"><div class="comment-name">Quản trị viên</div>alo 👋</div></div>
      <div class="comment"><div class="comment-avatar">VN</div><div class="comment-copy"><div class="comment-name">Quản trị viên</div>m thích giọng ông cụ không</div></div>
      <div class="comment"><div class="comment-avatar" style="background:#5a73ff">L</div><div class="comment-copy"><div class="comment-name" style="color:#cbd3ff">Linh</div>Hình ảnh rõ quá ❤️</div></div>
    </div>
    <div class="reaction-activity">
      <div class="activity-item glass"><div class="activity-avatar">L</div><span><strong>Linh</strong> đã thả</span><span class="activity-emoji">❤️</span></div>
      <div class="activity-item glass"><div class="activity-avatar" style="background:linear-gradient(145deg,#ff8b3d,#ff3e68)">M</div><span><strong>Minh Anh</strong> đã thả</span><span class="activity-emoji">😂</span></div>
    </div>
    <div class="flying">❤️</div><div class="flying two">😂</div><div class="flying three">😮</div><div class="flying four">❤️</div>
    <div class="reaction-menu glass">
      <div class="reaction-option selected">❤️</div>
      <div class="reaction-option">👍</div>
      <div class="reaction-option">😂</div>
      <div class="reaction-option">😮</div>
      <div class="reaction-option">😢</div>
      <div class="reaction-option">😡</div>
    </div>
    <div class="reaction-float">
      <div class="action primary"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg></div>
      <div class="action glass"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.7 10.7l6.6-4.2M8.7 13.3l6.6 4.2"/></svg></div>
    </div>
    <div class="live-chip glass"><div class="spark">✦</div><div class="live-chip-text"><div class="live-chip-title">Trực tiếp</div><div class="live-chip-sub">Chào mừng mọi người đến với buổi live!</div></div><div class="chev"></div></div>
    <div class="composer">
      <div class="input glass"><span>Viết bình luận...</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.3 2 3.5 2 3.5-2 3.5-2M9 9.5h.01M15 9.5h.01"/></svg></div>
      <div class="composer-btn glass"><svg viewBox="0 0 24 24"><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7M8 7l4-4 4 4M12 3v13"/></svg></div>
    </div>
  </main>
</body>
</html>
